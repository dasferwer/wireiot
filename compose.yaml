services:
  database:
    image: postgres:17
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: wireiot
    ports: ["127.0.0.1:54837:5432"]
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d wireiot"]
      interval: 2s
      timeout: 2s
      retries: 30
  rabbitmq:
    image: rabbitmq:4-alpine
    environment:
      RABBITMQ_DEFAULT_USER: demo
      RABBITMQ_DEFAULT_PASS: demo
    ports: ["127.0.0.1:5637:5672"]
  api:
    build: .
    environment: &environment
      DATABASE_URL: postgresql://demo:demo@database/wireiot
      API_KEY: local-demo-key
      AMQP_URL: amqp://demo:demo@rabbitmq:5672/%2F
    ports: ["127.0.0.1:8097:8000"]
    depends_on:
      database: {condition: service_healthy}
  worker:
    build: .
    command: ["python", "-m", "wireiot.worker"]
    environment: *environment
    depends_on:
      database: {condition: service_healthy}
      rabbitmq: {condition: service_started}
  mqtt:
    image: eclipse-mosquitto:2
    ports: ["127.0.0.1:18837:1883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt:/mosquitto/data
  bridge:
    build: .
    command: ["python", "-m", "wireiot.bridge"]
    environment:
      <<: *environment
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
    depends_on:
      database: {condition: service_healthy}
      mqtt: {condition: service_started}
volumes:
  database:
  mqtt:
